[project]
name = "ai-engineering"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "camdenjstoker", email = "sto22016@byui.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain[mcp]>=1.4.2",
    "langchain-google-genai>=4.4.0",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
    "httpx>=0.28.1",
    "winrt-runtime>=3.2.1",
    "winrt-windows-foundation>=3.2.1",
    "winrt-windows-media-core>=3.2.1",
    "winrt-windows-media-playback>=3.2.1",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pystray>=0.19.5",
    "pillow>=12.3.0",
]

[project.scripts]
ai-engineering = "ai_engineering:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
